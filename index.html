<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

  <title>Eiscafe Tiziano – Info</title>
  <meta name="description" content="Aktuelle Info von Eiscafe Tiziano: Mitnehmen, Innenbereich, Lieferservice und wichtige Links." />

  <style>
    :root{
      --bg:#f3f3f3;
      --card:#ffffff;
      --text:#111111;
      --muted:#64686f;
      --line:#e4e4e4;

      --green:#1fa65a;
      --green-soft:#e9f7ee;
      --green-line:#cdebd8;

      --red:#d93b3b;
      --red-soft:#fdeaea;
      --red-line:#f5c5c5;

      --blue:#2f73d9;
      --blue-soft:#eef5ff;
      --blue-line:#cfe1ff;

      --orange:#a46a12;
      --orange-soft:#fff6e8;
      --orange-line:#f1d8ae;

      --shadow:0 8px 22px rgba(0,0,0,.06);
    }

    *{
      box-sizing:border-box;
    }

    html, body{
      margin:0;
      padding:0;
      min-height:100%;
    }

    body{
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
      background:var(--bg);
      color:var(--text);
    }

    .page{
      min-height:100dvh;
      padding:12px;
      display:flex;
      align-items:flex-start;
      justify-content:center;
    }

    .card{
      width:100%;
      max-width:760px;
      background:var(--card);
      border:1px solid var(--line);
      border-radius:28px;
      box-shadow:var(--shadow);
      padding:18px 16px 16px;
    }

    .header{
      text-align:center;
      margin-bottom:16px;
    }

    .logo-box{
      width:130px;
      max-width:40%;
      margin:0 auto 10px;
      background:#ffffff;
      border:1px solid var(--line);
      border-radius:20px;
      box-shadow:0 3px 12px rgba(0,0,0,.045);
      padding:6px;
    }

    .logo{
      width:100%;
      height:auto;
      display:block;
      border-radius:14px;
    }

    h1{
      margin:0;
      font-size:36px;
      line-height:1.05;
      letter-spacing:-0.8px;
      font-weight:950;
    }

    .status-list{
      display:grid;
      gap:12px;
      margin-bottom:14px;
    }

    .status-card{
      background:#ffffff;
      border:1px solid #e8e8e8;
      border-radius:20px;
      box-shadow:0 3px 10px rgba(0,0,0,.03);
      padding:16px 16px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
    }

    .status-left{
      display:flex;
      align-items:center;
      gap:12px;
      min-width:0;
    }

    .status-dot{
      width:15px;
      height:15px;
      border-radius:50%;
      flex-shrink:0;
    }

    .status-dot.open{
      background:var(--green);
    }

    .status-dot.closed{
      background:var(--red);
    }

    .status-title{
      font-size:22px;
      font-weight:950;
      color:#202124;
      line-height:1.15;
    }

    .status-badge{
      flex-shrink:0;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-width:126px;
      padding:9px 14px;
      border-radius:999px;
      font-weight:950;
      font-size:18px;
      text-align:center;
      border:1.5px solid transparent;
    }

    .status-badge.open{
      background:var(--green-soft);
      color:var(--green);
      border-color:var(--green-line);
    }

    .status-badge.closed{
      background:var(--red-soft);
      color:var(--red);
      border-color:var(--red-line);
    }

    .buttons{
      display:grid;
      grid-template-columns:1fr;
      gap:10px;
    }

    .button{
      display:flex;
      align-items:center;
      justify-content:center;
      text-decoration:none;
      text-align:center;
      font-weight:950;
      font-size:17px;
      padding:12px 14px;
      border-radius:999px;
      border:1.5px solid transparent;
      box-shadow:0 3px 10px rgba(0,0,0,.03);
    }

    .button.blue{
      background:var(--blue-soft);
      color:var(--blue);
      border-color:var(--blue-line);
    }

    .button.orange{
      background:var(--orange-soft);
      color:var(--orange);
      border-color:var(--orange-line);
    }

    .button.red{
      background:var(--red-soft);
      color:var(--red);
      border-color:var(--red-line);
    }

    @media (min-width:700px){
      .logo-box{
        width:145px;
      }

      h1{
        font-size:40px;
      }

      .status-title{
        font-size:24px;
      }

      .status-badge{
        min-width:136px;
        font-size:19px;
      }

      .buttons{
        grid-template-columns:1fr 1fr 1fr;
      }
    }

    @media (max-width:390px){
      .page{
        padding:10px;
      }

      .card{
        padding:16px 13px 14px;
      }

      .logo-box{
        width:118px;
      }

      h1{
        font-size:32px;
      }

      .status-card{
        padding:14px 13px;
      }

      .status-title{
        font-size:20px;
      }

      .status-badge{
        min-width:114px;
        font-size:16px;
        padding:8px 12px;
      }

      .button{
        font-size:16px;
        padding:11px 12px;
      }
    }

    @media (max-width:340px){
      .status-card{
        flex-direction:column;
        align-items:flex-start;
      }

      .status-badge{
        width:100%;
      }
    }
  </style>
</head>

<body>
  <div class="page">
    <main class="card">

      <header class="header">
        <div class="logo-box">
          <img class="logo" src="logo-tiziano.png" alt="Eiscafe Tiziano Logo">
        </div>

        <h1>Eiscafe Tiziano</h1>
      </header>

      <section class="status-list">

        <div class="status-card">
          <div class="status-left">
            <span class="status-dot closed" id="dot-mitnehmen"></span>
            <div class="status-title">Mitnehmen</div>
          </div>
          <div class="status-badge closed" id="status-mitnehmen">wird geladen…</div>
        </div>

        <div class="status-card">
          <div class="status-left">
            <span class="status-dot closed" id="dot-innenbereich"></span>
            <div class="status-title">Innen / Gästebereich</div>
          </div>
          <div class="status-badge closed" id="status-innenbereich">wird geladen…</div>
        </div>

        <div class="status-card">
          <div class="status-left">
            <span class="status-dot closed" id="dot-lieferservice"></span>
            <div class="status-title">Lieferservice</div>
          </div>
          <div class="status-badge closed" id="status-lieferservice">wird geladen…</div>
        </div>

      </section>

      <section class="buttons">
        <a class="button blue" href="https://eiscafetizianomayen.github.io/Liefermenu/">zum Lieferservice-Menü</a>
        <a class="button orange" href="https://eiscafetizianomayen.github.io/Liefergebiete/">Zu den Liefergebieten</a>
        <a class="button red" href="https://eiscafetizianomayen.github.io/Oeffnungszeiten/">Zu den Öffnungszeiten</a>
      </section>

    </main>
  </div>

  <script>
    /*
      HIER ÄNDERST DU DIE ÖFFNUNGSZEITEN.

      Wochentage:
      0 = Sonntag
      1 = Montag
      2 = Dienstag
      3 = Mittwoch
      4 = Donnerstag
      5 = Freitag
      6 = Samstag

      Wenn geschlossen:
      { closed: true }

      Wenn geöffnet:
      { open: "11:00", close: "21:00" }
    */

    const OPENING_HOURS = {
      mitnehmen: {
        0: { open: "13:00", close: "21:00" },
        1: { closed: true },
        2: { open: "11:00", close: "21:00" },
        3: { open: "11:00", close: "21:00" },
        4: { open: "11:00", close: "21:00" },
        5: { open: "11:00", close: "21:00" },
        6: { open: "11:00", close: "21:00" }
      },

      innenbereich: {
        0: { open: "13:00", close: "21:00" },
        1: { closed: true },
        2: { open: "11:00", close: "21:00" },
        3: { open: "11:00", close: "21:00" },
        4: { open: "11:00", close: "21:00" },
        5: { open: "11:00", close: "21:00" },
        6: { open: "11:00", close: "21:00" }
      },

      lieferservice: {
        0: { open: "13:00", close: "21:00" },
        1: { closed: true },
        2: { open: "17:00", close: "21:00" },
        3: { open: "17:00", close: "21:00" },
        4: { open: "17:00", close: "21:00" },
        5: { open: "17:00", close: "21:00" },
        6: { open: "17:00", close: "21:00" }
      }
    };

    const TIME_ZONE = "Europe/Berlin";

    function getBerlinDateParts(){
      const formatter = new Intl.DateTimeFormat("de-DE", {
        timeZone: TIME_ZONE,
        weekday: "long",
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit",
        hourCycle: "h23"
      });

      const parts = formatter.formatToParts(new Date());
      const result = {};

      parts.forEach(part => {
        if (part.type !== "literal") {
          result[part.type] = part.value;
        }
      });

      return result;
    }

    function getDayNumberGerman(weekday){
      const days = {
        "Sonntag": 0,
        "Montag": 1,
        "Dienstag": 2,
        "Mittwoch": 3,
        "Donnerstag": 4,
        "Freitag": 5,
        "Samstag": 6
      };
      return days[weekday];
    }

    function timeToMinutes(time){
      const parts = time.split(":").map(Number);
      return parts[0] * 60 + parts[1];
    }

    function isAreaOpen(areaName, dayNumber, currentMinutes){
      const today = OPENING_HOURS[areaName][dayNumber];

      if (!today || today.closed) return false;

      const openMinutes = timeToMinutes(today.open);
      const closeMinutes = timeToMinutes(today.close);

      return currentMinutes >= openMinutes && currentMinutes < closeMinutes;
    }

    function setStatus(elementId, dotId, isOpen){
      const element = document.getElementById(elementId);
      const dot = document.getElementById(dotId);

      element.textContent = isOpen ? "Geöffnet" : "Geschlossen";

      element.classList.toggle("open", isOpen);
      element.classList.toggle("closed", !isOpen);

      dot.classList.toggle("open", isOpen);
      dot.classList.toggle("closed", !isOpen);
    }

    function updateStatus(){
      const dateParts = getBerlinDateParts();
      const weekday = dateParts.weekday;
      const hour = Number(dateParts.hour);
      const minute = Number(dateParts.minute);

      const dayNumber = getDayNumberGerman(weekday);
      const currentMinutes = hour * 60 + minute;

      setStatus(
        "status-mitnehmen",
        "dot-mitnehmen",
        isAreaOpen("mitnehmen", dayNumber, currentMinutes)
      );

      setStatus(
        "status-innenbereich",
        "dot-innenbereich",
        isAreaOpen("innenbereich", dayNumber, currentMinutes)
      );

      setStatus(
        "status-lieferservice",
        "dot-lieferservice",
        isAreaOpen("lieferservice", dayNumber, currentMinutes)
      );
    }

    updateStatus();
    setInterval(updateStatus, 60000);
  </script>
</body>
</html>
