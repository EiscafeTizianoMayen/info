<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Eiscafe Tiziano – Info</title>
  <meta name="description" content="Aktuelle Info von Eiscafe Tiziano: Mitnehmen, Innenbereich, Lieferservice und wichtige Links." />

  <style>
    :root{
      --bg:#f3f3f3;
      --surface:#ffffff;
      --surface-soft:#fafafa;
      --text:#111111;
      --muted:#5f6368;
      --line:#dddddd;
      --shadow:0 6px 18px rgba(0,0,0,.08);

      --blue:#3b82f6;
      --orange:#e7a23b;
      --red:#e4554d;
      --gray:#d6d6d6;

      --green-open:#1ea75c;
      --green-open-bg:#e8f7ef;
      --green-open-border:#cfead9;

      --red-closed:#d63b3b;
      --red-closed-bg:#fdecec;
      --red-closed-border:#f3caca;

      --radius-xl:22px;
      --radius-lg:18px;
      --radius-md:14px;
    }

    *{box-sizing:border-box}

    html,body{
      margin:0;
      padding:0;
      background:var(--bg);
      color:var(--text);
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    }

    body{
      padding:14px;
    }

    .page{
      max-width:560px;
      margin:0 auto;
    }

    .hero{
      background:var(--surface);
      border:1px solid var(--line);
      border-radius:var(--radius-xl);
      box-shadow:var(--shadow);
      padding:18px 18px 16px;
      margin-bottom:14px;
      text-align:center;
    }

    .logo-badge{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      background:#f7f7f7;
      border:1px solid #e6e6e6;
      border-radius:20px;
      padding:10px 14px;
      margin-bottom:12px;
      box-shadow:0 2px 8px rgba(0,0,0,.04);
    }

    .logo-badge img{
      display:block;
      width:120px;
      max-width:100%;
      height:auto;
      object-fit:contain;
      opacity:.9;
    }

    h1{
      margin:0;
      font-size:clamp(34px,8vw,52px);
      line-height:1;
      letter-spacing:-.03em;
    }

    .subtitle{
      margin:8px 0 0;
      font-size:15px;
      color:var(--muted);
      line-height:1.35;
    }

    .today-pill{
      margin-top:14px;
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:10px 14px;
      background:#f7f7f7;
      border:1px solid var(--line);
      border-radius:999px;
      font-size:14px;
      font-weight:700;
      color:#2f2f2f;
    }

    .status-summary{
      margin-top:12px;
      display:grid;
      gap:8px;
    }

    .summary-item{
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      padding:10px 12px;
      background:#fafafa;
      border:1px solid #ececec;
      border-radius:14px;
      text-align:left;
    }

    .summary-name{
      display:flex;
      align-items:center;
      gap:8px;
      font-size:14px;
      font-weight:800;
      color:#222;
      min-width:0;
    }

    .summary-dot{
      width:10px;
      height:10px;
      border-radius:50%;
      flex:0 0 auto;
    }

    .summary-dot.open{ background:var(--green-open); }
    .summary-dot.closed{ background:var(--red-closed); }

    .summary-state{
      flex:0 0 auto;
      font-size:13px;
      font-weight:850;
      padding:6px 9px;
      border-radius:999px;
      border:1px solid transparent;
    }

    .summary-state.open{
      color:var(--green-open);
      background:var(--green-open-bg);
      border-color:var(--green-open-border);
    }

    .summary-state.closed{
      color:var(--red-closed);
      background:var(--red-closed-bg);
      border-color:var(--red-closed-border);
    }

    .quick-card{
      background:var(--surface);
      border:1px solid var(--line);
      border-radius:var(--radius-xl);
      box-shadow:var(--shadow);
      padding:14px 16px;
      margin-bottom:14px;
    }

    .links{
      display:grid;
      gap:8px;
    }

    .link-btn{
      display:flex;
      align-items:center;
      justify-content:center;
      text-align:center;
      text-decoration:none;
      padding:12px 14px;
      border-radius:14px;
      font-weight:800;
      font-size:15px;
      border:1px solid transparent;
      transition:.15s ease;
    }

    .link-btn.primary{
      background:#edf4ff;
      color:#1f5fd1;
      border-color:#d9e7ff;
    }

    .link-btn.secondary{
      background:#fff4e5;
      color:#a86a0a;
      border-color:#f3dfbd;
    }

    .link-btn.danger{
      background:#fdecec;
      color:#c83b3b;
      border-color:#f3caca;
    }

    .link-btn:hover{
      filter:brightness(.98);
      transform:translateY(-1px);
    }

    .footer{
      margin-top:14px;
      background:var(--surface);
      border:1px solid var(--line);
      border-radius:var(--radius-xl);
      box-shadow:var(--shadow);
      padding:14px 16px;
      font-size:14px;
      color:var(--muted);
      line-height:1.4;
      text-align:center;
    }

    .footer strong{
      color:var(--text);
    }

    .footer-logo{
      margin-top:10px;
      opacity:.55;
    }

    .footer-logo img{
      width:70px;
      height:auto;
      object-fit:contain;
    }

    @media (min-width: 900px){
      body{
        padding:28px 14px;
      }

      .hero,
      .quick-card,
      .footer{
        box-shadow:0 8px 24px rgba(0,0,0,.09);
      }
    }
  </style>
</head>

<body>
  <div class="page">

    <header class="hero">
      <div class="logo-badge">
        <img src="./logo-tiziano.png" alt="Eiscafe Tiziano Logo">
      </div>

      <h1>Eiscafe Tiziano</h1>
      <p class="subtitle">Mitnehmen · Innen / Gästebereich · Lieferservice</p>

      <div class="today-pill">📅 <span id="todayDate">wird geladen…</span></div>

      <div class="status-summary" id="statusSummary" aria-label="Aktueller Status"></div>
    </header>

    <section class="quick-card">
      <div class="links">
        <a class="link-btn primary" href="https://eiscafetizianomayen.github.io/Liefermenu/">
          zum Lieferservice-Menü
        </a>

        <a class="link-btn secondary" href="https://eiscafetizianomayen.github.io/Liefergebiete/">
          Zu den Liefergebieten
        </a>

        <a class="link-btn danger" href="https://eiscafetizianomayen.github.io/Oeffnungszeiten/">
          Zu den Öffnungszeiten
        </a>
      </div>
    </section>

    <footer class="footer">
      <strong>Eiscafe Tiziano</strong><br>
      Marktstraße 18 · 56727 Mayen

      <div class="footer-logo">
        <img src="./logo-tiziano.png" alt="Eiscafe Tiziano Logo klein">
      </div>
    </footer>

  </div>

  <script>
    const areas = [
      {
        key: "mitnehmen",
        title: "Mitnehmen",
        holidayHours: [{ start: "13:00", end: "21:00" }],
        hours: {
          1: [],
          2: [{ start: "11:00", end: "21:00" }],
          3: [{ start: "11:00", end: "21:00" }],
          4: [{ start: "11:00", end: "21:00" }],
          5: [{ start: "10:30", end: "21:00" }],
          6: [{ start: "10:00", end: "21:00" }],
          0: [{ start: "13:00", end: "21:00" }]
        }
      },
      {
        key: "innen",
        title: "Innen / Gästebereich",
        holidayHours: [{ start: "13:00", end: "19:30" }],
        hours: {
          1: [],
          2: [{ start: "11:00", end: "19:30" }],
          3: [{ start: "11:00", end: "19:30" }],
          4: [{ start: "11:00", end: "19:30" }],
          5: [{ start: "10:30", end: "19:30" }],
          6: [{ start: "10:00", end: "19:30" }],
          0: [{ start: "13:00", end: "19:30" }]
        }
      },
      {
        key: "liefer",
        title: "Lieferservice",
        holidayHours: [{ start: "17:00", end: "20:30" }],
        hours: {
          1: [],
          2: [{ start: "17:00", end: "20:30" }],
          3: [{ start: "17:00", end: "20:30" }],
          4: [{ start: "17:00", end: "20:30" }],
          5: [{ start: "17:00", end: "20:30" }],
          6: [{ start: "17:00", end: "20:30" }],
          0: [{ start: "17:00", end: "20:30" }]
        }
      }
    ];

    function dateKey(date) {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, "0");
      const d = String(date.getDate()).padStart(2, "0");
      return `${y}-${m}-${d}`;
    }

    function addDays(date, days) {
      const result = new Date(date);
      result.setDate(result.getDate() + days);
      return result;
    }

    function getEasterSunday(year) {
      const a = year % 19;
      const b = Math.floor(year / 100);
      const c = year % 100;
      const d = Math.floor(b / 4);
      const e = b % 4;
      const f = Math.floor((b + 8) / 25);
      const g = Math.floor((b - f + 1) / 3);
      const h = (19 * a + b - d - g + 15) % 30;
      const i = Math.floor(c / 4);
      const k = c % 4;
      const l = (32 + 2 * e + 2 * i - h - k) % 7;
      const m = Math.floor((a + 11 * h + 22 * l) / 451);
      const month = Math.floor((h + l - 7 * m + 114) / 31);
      const day = ((h + l - 7 * m + 114) % 31) + 1;
      return new Date(year, month - 1, day);
    }

    function getRlpHoliday(date) {
      const year = date.getFullYear();
      const easter = getEasterSunday(year);

      const holidays = {
        [`${year}-01-01`]: "Neujahr",
        [dateKey(addDays(easter, -2))]: "Karfreitag",
        [dateKey(addDays(easter, 1))]: "Ostermontag",
        [`${year}-05-01`]: "Tag der Arbeit",
        [dateKey(addDays(easter, 39))]: "Christi Himmelfahrt",
        [dateKey(addDays(easter, 50))]: "Pfingstmontag",
        [dateKey(addDays(easter, 60))]: "Fronleichnam",
        [`${year}-10-03`]: "Tag der Deutschen Einheit",
        [`${year}-11-01`]: "Allerheiligen",
        [`${year}-12-25`]: "1. Weihnachtstag",
        [`${year}-12-26`]: "2. Weihnachtstag"
      };

      return holidays[dateKey(date)] || null;
    }

    function minutesFromTime(time) {
      const [h, m] = time.split(":").map(Number);
      return h * 60 + m;
    }

    function isOpenNow(slots, now = new Date()) {
      if (!slots || slots.length === 0) return false;
      const current = now.getHours() * 60 + now.getMinutes();

      return slots.some(slot => {
        const start = minutesFromTime(slot.start);
        const end = minutesFromTime(slot.end);
        return current >= start && current < end;
      });
    }

    function updateTodayDate() {
      const formatter = new Intl.DateTimeFormat("de-DE", {
        weekday: "long",
        day: "2-digit",
        month: "2-digit",
        year: "numeric"
      });

      document.getElementById("todayDate").textContent = formatter.format(new Date());
    }

    function buildStatusSummary() {
      const summaryEl = document.getElementById("statusSummary");
      const now = new Date();
      const today = now.getDay();
      const holidayName = getRlpHoliday(now);

      summaryEl.innerHTML = areas.map(area => {
        const todaySlots = holidayName && area.holidayHours
          ? area.holidayHours
          : (area.hours[today] || []);

        const open = isOpenNow(todaySlots, now);
        const state = open ? "Geöffnet" : "Geschlossen";
        const stateClass = open ? "open" : "closed";

        return `
          <div class="summary-item">
            <div class="summary-name">
              <span class="summary-dot ${stateClass}"></span>
              <span>${area.title}</span>
            </div>
            <div class="summary-state ${stateClass}">${state}</div>
          </div>
        `;
      }).join("");
    }

    function renderAll() {
      updateTodayDate();
      buildStatusSummary();
    }

    renderAll();
    setInterval(renderAll, 60000);
  </script>
</body>
</html>
