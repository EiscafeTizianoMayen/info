<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>Eiscafe Tiziano – Info</title>
  <meta name="description" content="Aktuelle Info von Eiscafe Tiziano: Mitnehmen, Innenbereich, Lieferservice und wichtige Links." />

  <style>
    :root{
      --bg:#f3f3f3;
      --surface:#ffffff;
      --surface-soft:#fafafa;
      --text:#111111;
      --muted:#5f6368;
      --line:#e4e4e4;
      --shadow:0 8px 24px rgba(0,0,0,.07);

      --green:#1fa65a;
      --green-soft:#e9f7ee;
      --green-line:#cdebd8;

      --red:#d93b3b;
      --red-soft:#fdeaea;
      --red-line:#f5c5c5;

      --blue:#2f73d9;
      --blue-soft:#eef5ff;
      --blue-line:#cfe1ff;

      --orange:#a46a12;
      --orange-soft:#fff6e8;
      --orange-line:#f1d8ae;
    }

    *{
      box-sizing:border-box;
    }

    html{
      scroll-behavior:smooth;
    }

    body{
      margin:0;
      font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
      background:var(--bg);
      color:var(--text);
    }

    .page{
      min-height:100vh;
      padding:22px 14px 18px;
    }

    .main-card{
      max-width:920px;
      margin:0 auto 22px;
      background:var(--surface);
      border:1px solid var(--line);
      border-radius:28px;
      box-shadow:var(--shadow);
      padding:28px 18px 28px;
      overflow:hidden;
    }

    .header{
      text-align:center;
      margin-bottom:26px;
    }

    .logo-box{
      width:min(320px, 78%);
      margin:0 auto 18px;
      background:#ffffff;
      border:1px solid var(--line);
      border-radius:32px;
      box-shadow:0 4px 18px rgba(0,0,0,.05);
      padding:10px;
    }

    .logo{
      width:100%;
      height:auto;
      display:block;
      border-radius:22px;
    }

    .brand{
      margin:0 0 6px;
      color:var(--muted);
      font-size:22px;
      font-weight:900;
      letter-spacing:.2px;
    }

    h1{
      margin:0;
      font-size:56px;
      line-height:1.04;
      letter-spacing:-1.7px;
      font-weight:950;
    }

    .subtitle{
      margin:18px auto 0;
      max-width:760px;
      color:var(--muted);
      font-size:25px;
      font-weight:700;
      line-height:1.35;
    }

    .date-pill{
      width:max-content;
      max-width:100%;
      margin:0 auto 26px;
      background:var(--surface-soft);
      border:2px solid var(--line);
      border-radius:999px;
      padding:12px 28px;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:12px;
      box-shadow:0 4px 14px rgba(0,0,0,.04);
    }

    .calendar{
      font-size:27px;
      line-height:1;
    }

    .date-text{
      font-size:24px;
      font-weight:900;
      color:#303134;
      white-space:nowrap;
    }

    .status-list{
      display:grid;
      gap:16px;
    }

    .status-card{
      background:#ffffff;
      border:1px solid #e8e8e8;
      border-radius:22px;
      box-shadow:0 4px 14px rgba(0,0,0,.035);
      padding:21px 24px;
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:16px;
    }

    .status-left{
      display:flex;
      align-items:center;
      gap:15px;
      min-width:0;
    }

    .status-dot{
      width:18px;
      height:18px;
      border-radius:50%;
      flex-shrink:0;
    }

    .status-dot.open{
      background:var(--green);
    }

    .status-dot.closed{
      background:var(--red);
    }

    .status-title{
      font-size:25px;
      font-weight:950;
      color:#202124;
      line-height:1.15;
    }

    .status-badge{
      flex-shrink:0;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-width:154px;
      padding:11px 18px;
      border-radius:999px;
      font-weight:950;
      font-size:20px;
      text-align:center;
      border:2px solid transparent;
    }

    .status-badge.open{
      background:var(--green-soft);
      color:var(--green);
      border-color:var(--green-line);
    }

    .status-badge.closed{
      background:var(--red-soft);
      color:var(--red);
      border-color:var(--red-line);
    }

    .links-card{
      max-width:920px;
      margin:0 auto 18px;
      background:var(--surface);
      border:1px solid var(--line);
      border-radius:28px;
      box-shadow:var(--shadow);
      padding:18px;
    }

    .buttons{
      display:grid;
      grid-template-columns:1fr;
      gap:14px;
    }

    .button{
      display:flex;
      align-items:center;
      justify-content:center;
      text-decoration:none;
      text-align:center;
      font-weight:950;
      font-size:21px;
      padding:17px 18px;
      border-radius:999px;
      border:2px solid transparent;
      box-shadow:0 4px 14px rgba(0,0,0,.035);
      transition:transform .15s ease, opacity .15s ease;
    }

    .button:hover{
      transform:translateY(-1px);
      opacity:.92;
    }

    .button.blue{
      background:var(--blue-soft);
      color:var(--blue);
      border-color:var(--blue-line);
    }

    .button.orange{
      background:var(--orange-soft);
      color:var(--orange);
      border-color:var(--orange-line);
    }

    .button.red{
      background:var(--red-soft);
      color:var(--red);
      border-color:var(--red-line);
    }

    footer{
      max-width:920px;
      margin:0 auto;
      text-align:center;
      padding:8px 18px 18px;
      color:var(--muted);
      font-size:14px;
    }

    .footer-name{
      font-weight:900;
      color:#202124;
      margin-bottom:4px;
    }

    @media (min-width:760px){
      .buttons{
        grid-template-columns:1fr 1fr 1fr;
      }
    }

    @media (max-width:620px){
      .page{
        padding:18px 10px;
      }

      .main-card,
      .links-card{
        border-radius:26px;
      }

      .main-card{
        padding:24px 16px 24px;
      }

      .logo-box{
        width:min(300px, 82%);
        border-radius:30px;
      }

      .brand{
        font-size:21px;
      }

      h1{
        font-size:44px;
        letter-spacing:-1.2px;
      }

      .subtitle{
        font-size:21px;
      }

      .date-pill{
        padding:11px 20px;
      }

      .date-text{
        font-size:21px;
      }

      .status-card{
        padding:19px 18px;
      }

      .status-title{
        font-size:22px;
      }

      .status-badge{
        min-width:136px;
        font-size:18px;
        padding:10px 14px;
      }

      .button{
        font-size:19px;
        padding:15px 16px;
      }
    }

    @media (max-width:430px){
      .page{
        padding:14px 8px;
      }

      .main-card,
      .links-card{
        border-radius:24px;
      }

      .logo-box{
        width:min(285px, 86%);
      }

      h1{
        font-size:38px;
      }

      .subtitle{
        font-size:19px;
      }

      .date-text{
        font-size:18px;
      }

      .calendar{
        font-size:23px;
      }

      .status-card{
        flex-direction:column;
        align-items:flex-start;
      }

      .status-badge{
        width:100%;
      }
    }
  </style>
</head>

<body>
  <div class="page">

    <section class="main-card">

      <header class="header">
        <div class="logo-box">
          <img class="logo" src="logo-tiziano.png" alt="Eiscafe Tiziano Logo">
        </div>

        <div class="brand">Eiscafe Tiziano</div>
        <h1>Öffnungszeiten</h1>
        <div class="subtitle">Mitnehmen · Innen / Gästebereich · Lieferservice</div>
      </header>

      <section class="date-pill">
        <div class="calendar">📅</div>
        <div class="date-text" id="todayDate">wird geladen…</div>
      </section>

      <section class="status-list">

        <div class="status-card">
          <div class="status-left">
            <span class="status-dot closed" id="dot-mitnehmen"></span>
            <div class="status-title">Mitnehmen</div>
          </div>
          <div class="status-badge closed" id="status-mitnehmen">wird geladen…</div>
        </div>

        <div class="status-card">
          <div class="status-left">
            <span class="status-dot closed" id="dot-innenbereich"></span>
            <div class="status-title">Innen / Gästebereich</div>
          </div>
          <div class="status-badge closed" id="status-innenbereich">wird geladen…</div>
        </div>

        <div class="status-card">
          <div class="status-left">
            <span class="status-dot closed" id="dot-lieferservice"></span>
            <div class="status-title">Lieferservice</div>
          </div>
          <div class="status-badge closed" id="status-lieferservice">wird geladen…</div>
        </div>

      </section>

    </section>

    <section class="links-card">
      <div class="buttons">
        <a class="button blue" href="https://eiscafetizianomayen.github.io/Liefermenu/">zum Lieferservice-Menü</a>
        <a class="button orange" href="https://eiscafetizianomayen.github.io/Liefergebiete/">Zu den Liefergebieten</a>
        <a class="button red" href="https://eiscafetizianomayen.github.io/Oeffnungszeiten/">Zu den Öffnungszeiten</a>
      </div>
    </section>

    <footer>
      <div class="footer-name">Eiscafe Tiziano</div>
      <div>Marktstraße 18 · 56727 Mayen</div>
    </footer>

  </div>

  <script>
    /*
      HIER ÄNDERST DU DIE ÖFFNUNGSZEITEN.

      Wochentage:
      0 = Sonntag
      1 = Montag
      2 = Dienstag
      3 = Mittwoch
      4 = Donnerstag
      5 = Freitag
      6 = Samstag

      Wenn geschlossen:
      { closed: true }

      Wenn geöffnet:
      { open: "11:00", close: "21:00" }
    */

    const OPENING_HOURS = {
      mitnehmen: {
        0: { open: "13:00", close: "21:00" },
        1: { closed: true },
        2: { open: "11:00", close: "21:00" },
        3: { open: "11:00", close: "21:00" },
        4: { open: "11:00", close: "21:00" },
        5: { open: "11:00", close: "21:00" },
        6: { open: "11:00", close: "21:00" }
      },

      innenbereich: {
        0: { open: "13:00", close: "21:00" },
        1: { closed: true },
        2: { open: "11:00", close: "21:00" },
        3: { open: "11:00", close: "21:00" },
        4: { open: "11:00", close: "21:00" },
        5: { open: "11:00", close: "21:00" },
        6: { open: "11:00", close: "21:00" }
      },

      lieferservice: {
        0: { open: "13:00", close: "21:00" },
        1: { closed: true },
        2: { open: "17:00", close: "21:00" },
        3: { open: "17:00", close: "21:00" },
        4: { open: "17:00", close: "21:00" },
        5: { open: "17:00", close: "21:00" },
        6: { open: "17:00", close: "21:00" }
      }
    };

    const TIME_ZONE = "Europe/Berlin";

    function getBerlinDateParts(){
      const formatter = new Intl.DateTimeFormat("de-DE", {
        timeZone: TIME_ZONE,
        weekday: "long",
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit",
        hourCycle: "h23"
      });

      const parts = formatter.formatToParts(new Date());
      const result = {};

      parts.forEach(part => {
        if (part.type !== "literal") {
          result[part.type] = part.value;
        }
      });

      return result;
    }

    function getDayNumberGerman(weekday){
      const days = {
        "Sonntag": 0,
        "Montag": 1,
        "Dienstag": 2,
        "Mittwoch": 3,
        "Donnerstag": 4,
        "Freitag": 5,
        "Samstag": 6
      };

      return days[weekday];
    }

    function timeToMinutes(time){
      const parts = time.split(":").map(Number);
      return parts[0] * 60 + parts[1];
    }

    function isAreaOpen(areaName, dayNumber, currentMinutes){
      const today = OPENING_HOURS[areaName][dayNumber];

      if (!today || today.closed) {
        return false;
      }

      const openMinutes = timeToMinutes(today.open);
      const closeMinutes = timeToMinutes(today.close);

      return currentMinutes >= openMinutes && currentMinutes < closeMinutes;
    }

    function setStatus(elementId, dotId, isOpen){
      const element = document.getElementById(elementId);
      const dot = document.getElementById(dotId);

      element.textContent = isOpen ? "Geöffnet" : "Geschlossen";

      element.classList.toggle("open", isOpen);
      element.classList.toggle("closed", !isOpen);

      dot.classList.toggle("open", isOpen);
      dot.classList.toggle("closed", !isOpen);
    }

    function updateStatus(){
      const dateParts = getBerlinDateParts();

      const weekday = dateParts.weekday;
      const day = dateParts.day;
      const month = dateParts.month;
      const year = dateParts.year;
      const hour = Number(dateParts.hour);
      const minute = Number(dateParts.minute);

      const dayNumber = getDayNumberGerman(weekday);
      const currentMinutes = hour * 60 + minute;

      document.getElementById("todayDate").textContent =
        `${weekday}, ${day}.${month}.${year}`;

      setStatus(
        "status-mitnehmen",
        "dot-mitnehmen",
        isAreaOpen("mitnehmen", dayNumber, currentMinutes)
      );

      setStatus(
        "status-innenbereich",
        "dot-innenbereich",
        isAreaOpen("innenbereich", dayNumber, currentMinutes)
      );

      setStatus(
        "status-lieferservice",
        "dot-lieferservice",
        isAreaOpen("lieferservice", dayNumber, currentMinutes)
      );
    }

    updateStatus();
    setInterval(updateStatus, 60000);
  </script>

</body>
</html>
